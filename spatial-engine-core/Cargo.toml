[package]
name = "spatial-engine-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.6", features = ["ws"] }
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3"

[[bin]]
name = "spatial-engine-core"
path = "src/main.rs"
